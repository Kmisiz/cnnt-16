# /etc/nginx/sites-available/muoisau.conf  (tren vps0-web-public 10.10.10.5)
#
#   sudo ln -sf /etc/nginx/sites-available/muoisau.conf /etc/nginx/sites-enabled/muoisau.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server_tokens off;   # trang loi chi hien "nginx", khong lo phien ban

server {
    listen 80 default_server;
    server_name muoisaubank16.duckdns.org 34.124.217.241 _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name muoisaubank16.duckdns.org 34.124.217.241 _;

    # Chung chi SSL: Ho tro Certbot (Let's Encrypt) hoac OpenSSL tu ky
    ssl_certificate     /etc/letsencrypt/live/muoisaubank16.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muoisaubank16.duckdns.org/privkey.pem;
    # Fallback OpenSSL neu chua co domain:
    # ssl_certificate     /etc/nginx/ssl/bank.crt;
    # ssl_certificate_key /etc/nginx/ssl/bank.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 64k;

    # HSTS: trinh duyet chi dung HTTPS voi ten mien nay trong 1 nam (khong ap dung khi truy cap bang IP)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    root  /var/www/muoisau;
    index index.html;

    # Trang khach hang
    location / {
        try_files $uri $uri/ =404;
    }

    # Cong quan tri: chi phuc vu khi backend xac nhan phien la nhan vien.
    # Nguoi khac (ke ca khach da dang nhap) nhan trang 404 mac dinh cua nginx,
    # khong biet duong dan nay ton tai.
    location ^~ /admin {
        auth_request /_internal/staff-check;
        error_page 401 403 = @not_found;
        try_files $uri $uri/ =404;
    }

    location = /_internal/staff-check {
        internal;
        proxy_pass http://10.10.10.10:8080/api/auth/staff-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location @not_found {
        return 404;
    }

    # API: chi chuyen tiep sang chot chan WAF vps1, vps0 khong biet vps2/vps3
    location /api/ {
        proxy_pass http://10.10.10.10:8080;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
}
