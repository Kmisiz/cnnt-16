# ============================================================================
# MUOI SAU BANK - DMZ WAF & RATE-LIMITING GATEWAY (VPS1: 10.10.10.10)
# Duong dan: /etc/nginx/sites-available/muoisau-waf.conf
# Chi nhan request tu VPS0 (10.10.10.5) hoac VPS4 Management (10.10.10.40)
# va chuyen tiep (Reverse Proxy) ve VPS2 Core API (10.10.10.20:8080)
# ============================================================================

# 1. Dinh nghia vung Rate Limiting chong Brute-force & DoS
# - /api/login: Toi da 5 requests/phut tren moi IP khach hang (theo X-Real-IP do VPS0 truyen xuong)
# - /api/* chung: Toi da 10 requests/giay tren moi IP
limit_req_zone $http_x_real_ip zone=login_limit:10m rate=5r/m;
limit_req_zone $http_x_real_ip zone=api_limit:10m rate=10r/s;

server {
    listen 10.10.10.10:8080;
    server_name 10.10.10.10;

    server_tokens off;
    client_max_body_size 1M;

    # Ghi log truy cap WAF rieng de Rsyslog day ve VPS4 (10.10.10.40)
    access_log /var/log/nginx/waf_access.log;
    error_log  /var/log/nginx/waf_error.log warn;

    # 2. Layer 7 WAF Rules: Chan cac dau hieu SQL Injection / XSS / Path Traversal tren URL query
    if ($query_string ~* "(union.*select|select.*from|insert.*into|drop.*table|information_schema|<script|javascript:|\.\./)") {
        return 403 '{"detail": "WAF Blocked: Phat hien chuoi tan cong doc hai tren URL"}';
    }

    # Chan User-Agent cua cong cu quet lo hong tu dong
    if ($http_user_agent ~* (sqlmap|nikto|nmap|dirbuster|gobuster|wpscan|acunetix)) {
        return 403 '{"detail": "WAF Blocked: Cong cu quet tu dong bi tu choi"}';
    }

    # 3. Endpoint kiem tra quyen noi bo (/api/auth/staff-check) cho Nginx auth_request tren VPS0
    location = /api/auth/staff-check {
        proxy_pass http://10.10.10.20:8080/api/auth/staff-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URI $http_x_original_uri;
    }

    # 4. Rate Limiting nghiem ngat cho API Dang nhap (/api/login)
    location = /api/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://10.10.10.20:8080/api/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 5. Cac API nghiep vu con lai (/api/*)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://10.10.10.20:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Tu choi moi duong dan khong phai /api/
    location / {
        return 404 '{"detail": "Not Found"}';
    }
}
