<!--
  Wazuh – cấu hình dùng chung cho nhóm agent "web"
  Thành viên: vps0-web-public (001, web-server), vps1-dmz-fw (003, waf-server)
  Triển khai: vps4, /var/ossec/etc/shared/web/agent.conf
  Mục đích  : giám sát toàn vẹn tệp (FIM) cho giao diện web và cấu hình Nginx
-->
<agent_config>

  <syscheck>
    <!-- Giao diện web (vps0): phát hiện thay giao diện (defacement) và chèn mã độc vào trang -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/var/www/muoisau</directories>

    <!-- Cấu hình Nginx (vps0, vps1): phát hiện sửa luật WAF, tắt TLS hoặc đổi upstream -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/nginx</directories>
  </syscheck>

</agent_config>
